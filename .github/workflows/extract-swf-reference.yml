name: Extract SWF reference

on:
  push:
    branches:
      - codex/extract-original-workshop-data
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JPEXS Free Flash Decompiler
        run: |
          curl -L --fail -o ffdec.zip https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip
          unzip -q ffdec.zip -d ffdec
      - name: Decompile original ActionScript 1/2
        run: |
          mkdir -p reference/decompiled
          java -jar ffdec/ffdec.jar -cli -export script reference/decompiled mujaffa_3juni_2003.swf
          java -jar ffdec/ffdec.jar -cli -dumpAS2 -exportNames mujaffa_3juni_2003.swf > reference/as2-index.txt
      - uses: actions/upload-artifact@v6
        with:
          name: mujaffa-original-actionscript
          path: reference/
          if-no-files-found: error
