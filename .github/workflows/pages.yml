name: Mujaffa Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A PR build never deploys -- every Pages step below is gated on
  # `github.event_name != 'pull_request'` -- so it has no reason to share a
  # queue with the runs that do. It used to: one group held every run, and
  # GitHub keeps only one *pending* run per group, so a PR build entering the
  # queue evicted the `main` deploy waiting in it. `cancel-in-progress: false`
  # does not help, because it protects a run that has already started rather
  # than one still waiting. A merge to `main` could go green and never publish,
  # which is how #36 landed without reaching the site.
  #
  # Deploying runs stay in one group, serialised, which is what Pages wants.
  # Each PR now queues against itself instead.
  group: mujaffa-pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Mujaffa web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Mujaffa Remaster
        uses: actions/checkout@v4
        with:
          path: mujaffa
      - name: Read pinned Sindri revision
        id: engine
        shell: bash
        run: echo "ref=$(tr -d '\r\n' < mujaffa/.sindri-engine)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Sindri
        uses: actions/checkout@v4
        with:
          repository: vardirhq/sindri2
          ref: ${{ steps.engine.outputs.ref }}
          path: sindri2
      - name: Install Sindri Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux and browser dependencies
        run: |
          # None of these packages come from Microsoft's third-party apt feed.
          # The hosted Ubuntu image occasionally exposes that feed while it is
          # returning 403, which makes an otherwise unrelated apt update fail.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -delete
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan1 mesa-vulkan-drivers
          python -m pip install --disable-pip-version-check cairosvg pytest
      - name: Validate workshop state/catalogue
        working-directory: mujaffa
        env:
          PYTHONPATH: .
        run: |
          python tools/workshop_catalog.py
          python tools/workshop_free_mode_check.py
          pytest -q tests/
      - name: Compose the original classic title screens
        working-directory: mujaffa
        env:
          PYTHONPATH: tools
        run: |
          python tools/swf_art_extract.py mujaffa_3juni_2003.swf reference-art --scale 4
          python tools/swf_title_extract.py mujaffa_3juni_2003.swf reference-art assets/generated/title --scale 2
          python tools/install_title_scene.py --project .
      - name: Verify the committed title scene still matches the SWF
        working-directory: mujaffa
        shell: bash
        run: |
          # The scene in the repository is generated from recovered evidence. If
          # regenerating it changes anything, the committed title has drifted
          # from the original and the difference is the report.
          git diff --exit-code title.scene.json
          test -f assets/generated/title/png/title-backdrop.png
          test -f assets/generated/title/png/title-opening-1.sheet.json
          test -f assets/generated/title/png/title-prompt.png
          test "$(find assets/generated/title/png -name '*.png' | wc -l)" -ge 24
      - name: Generate layered Mujaffa car and showroom art
        run: python mujaffa/tools/prepare_runtime_art.py --project mujaffa --scale 4 --install-scene
      - name: Install composable car layer entities
        run: python mujaffa/tools/install_garage_scene.py --project mujaffa
      - name: Replace responsive scaffolding with original workshop
        run: python mujaffa/tools/install_workshop_parity.py --project mujaffa
      - name: Refine workshop chrome against original capture
        run: python mujaffa/tools/refine_workshop_chrome.py --project mujaffa
      - name: Install workshop interaction layer
        run: python mujaffa/tools/install_workshop_interactivity.py --project mujaffa
      - name: Verify workshop source
        shell: bash
        run: |
          test -f mujaffa/assets/generated/car/layers-manifest.json
          test -f mujaffa/assets/generated/car/paint-tintable.png
          test -f mujaffa/assets/generated/showroom/showroom-room.png
          test -f mujaffa/assets/generated/showroom/showroom-mujaffa.png
          test -f mujaffa/assets/generated/showroom/showroom-panel.png
          test -f mujaffa/assets/generated/showroom/showroom-manifest.json
          test -f mujaffa/assets/generated/workshop-ui/workshop-chrome.png
          test "$(find mujaffa/assets/generated/car -name '*.png' | wc -l)" -ge 50
          grep -q '"name": "Garage Desktop UI"' mujaffa/main.scene.json
          grep -q '"name": "Original Workshop Room"' mujaffa/main.scene.json
          grep -q '"name": "Original Workshop Mujaffa"' mujaffa/main.scene.json
          grep -q '"name": "Original Workshop Chrome"' mujaffa/main.scene.json
          grep -q '"name": "Workshop State"' mujaffa/main.scene.json
          grep -q '"name": "Title Start"' mujaffa/title.scene.json
          python -c 'import json; entities=json.load(open("mujaffa/main.scene.json"))["entities"]; buttons=[e for e in entities if e.get("id", "").startswith("workshop-category-") and e.get("id") != "workshop-category-controller"]; assert len(buttons) == 13, f"expected 13 workshop category buttons, got {len(buttons)}"'
          if grep -q 'Mobile Category Drawer' mujaffa/main.scene.json; then echo 'Responsive mobile drawer leaked into fixed workshop.' >&2; exit 1; fi
          if grep -q 'scripts/garage_polish.decay' mujaffa/main.scene.json; then echo 'Legacy mobile polish controller leaked into fixed workshop.' >&2; exit 1; fi
      - name: Cache Sindri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sindri2 -> target
          key: mujaffa-pages-${{ steps.engine.outputs.ref }}
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Cache browser tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            sindri2/scripts/browser/node_modules
          key: mujaffa-playwright-${{ runner.os }}-${{ steps.engine.outputs.ref }}
      - name: Install browser tooling
        working-directory: sindri2
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install-deps chromium
          npx --prefix scripts/browser playwright install chromium
      - name: Build Sindri browser host
        working-directory: sindri2
        run: wasm-pack build game --target web --release --out-dir pkg
      - name: Export Mujaffa project
        working-directory: sindri2
        run: cargo run --quiet --package sindri-export --bin sindri-export -- ../mujaffa target/mujaffa-pages --base /mujaffa-remaster/ --build-id "${GITHUB_SHA:0:7}"
      - name: Preserve original square game stage
        run: python mujaffa/tools/patch_web_shell.py sindri2/target/mujaffa-pages/index.html
      - name: Copy browser host into export
        working-directory: sindri2
        run: |
          mkdir -p target/mujaffa-pages/pkg
          cp -R game/pkg/. target/mujaffa-pages/pkg/
          touch target/mujaffa-pages/.nojekyll
      - name: Verify Pages payload
        working-directory: sindri2
        shell: bash
        run: |
          test -f target/mujaffa-pages/index.html
          test -f target/mujaffa-pages/assets/sindri.manifest.json
          test -f target/mujaffa-pages/pkg/sindri_gather.js
          test -f target/mujaffa-pages/pkg/sindri_gather_bg.wasm
          grep -q '"kind": "scene"' target/mujaffa-pages/assets/sindri.manifest.json
          grep -q '"kind": "script"' target/mujaffa-pages/assets/sindri.manifest.json
          grep -q '"kind": "texture"' target/mujaffa-pages/assets/sindri.manifest.json
          grep -q 'aspect-ratio: 1 / 1' target/mujaffa-pages/index.html
          if find target/mujaffa-pages -name '*.swf' -print -quit | grep -q .; then echo 'Reference SWF leaked into the Pages payload.' >&2; exit 1; fi
      - name: Smoke Mujaffa in Chromium
        working-directory: sindri2
        run: |
          mkdir -p target/render-artifacts
          SINDRI_EXPECT_ASSETS=1 SINDRI_EXPECT_ASSET_KINDS=scene,script,texture SINDRI_BASE_PATH=/mujaffa-remaster/ node scripts/browser/smoke.mjs target/mujaffa-pages target/render-artifacts/mujaffa.png
      - name: Upload browser capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mujaffa-browser-capture
          path: sindri2/target/render-artifacts/mujaffa.png
          if-no-files-found: warn
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: sindri2/target/mujaffa-pages
  deploy:
    name: Deploy Mujaffa
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
