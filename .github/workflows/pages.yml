name: Mujaffa Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mujaffa-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Mujaffa web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Mujaffa Remaster
        uses: actions/checkout@v4
        with:
          path: mujaffa

      - name: Read pinned Sindri revision
        id: engine
        shell: bash
        run: echo "ref=$(tr -d '\r\n' < mujaffa/.sindri-engine)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Sindri
        uses: actions/checkout@v4
        with:
          repository: vardirhq/sindri2
          ref: ${{ steps.engine.outputs.ref }}
          path: sindri2

      - name: Install Sindri Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan1 mesa-vulkan-drivers
          python -m pip install --disable-pip-version-check cairosvg

      - name: Generate layered Mujaffa car
        run: >-
          python mujaffa/tools/prepare_runtime_art.py
          --project mujaffa
          --scale 4
          --install-scene

      - name: Verify layered car source
        shell: bash
        run: |
          test -f mujaffa/assets/generated/car/layers-manifest.json
          test -f mujaffa/assets/generated/car/paint-tintable.png
          test -f mujaffa/assets/generated/car/daek-1.png
          test -f mujaffa/assets/generated/car/hjulkapsel-1-standard.png
          test "$(find mujaffa/assets/generated/car -name '*.png' | wc -l)" -ge 50
          grep -q '"parent": "parity-car"' mujaffa/main.scene.json
          grep -q 'assets/generated/car/' mujaffa/main.scene.json

      - name: Cache Sindri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sindri2 -> target
          key: mujaffa-pages-${{ steps.engine.outputs.ref }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Cache browser tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            sindri2/scripts/browser/node_modules
          key: mujaffa-playwright-${{ runner.os }}-${{ steps.engine.outputs.ref }}

      - name: Install browser tooling
        working-directory: sindri2
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install-deps chromium
          npx --prefix scripts/browser playwright install chromium

      - name: Build Sindri browser host
        working-directory: sindri2
        run: wasm-pack build game --target web --release --out-dir pkg

      - name: Export Mujaffa project
        working-directory: sindri2
        run: >-
          cargo run --quiet --package sindri-export --bin sindri-export --
          ../mujaffa
          target/mujaffa-pages
          --base /mujaffa-remaster/
          --build-id "${GITHUB_SHA:0:7}"

      - name: Copy browser host into export
        working-directory: sindri2
        run: |
          mkdir -p target/mujaffa-pages/pkg
          cp -R game/pkg/. target/mujaffa-pages/pkg/
          touch target/mujaffa-pages/.nojekyll

      - name: Verify Pages payload
        working-directory: sindri2
        shell: bash
        run: |
          test -f target/mujaffa-pages/index.html
          test -f target/mujaffa-pages/assets/sindri.manifest.json
          test -f target/mujaffa-pages/pkg/sindri_gather.js
          test -f target/mujaffa-pages/pkg/sindri_gather_bg.wasm
          grep -q '"kind": "scene"' target/mujaffa-pages/assets/sindri.manifest.json
          grep -q '"kind": "script"' target/mujaffa-pages/assets/sindri.manifest.json
          grep -q '"kind": "texture"' target/mujaffa-pages/assets/sindri.manifest.json
          if find target/mujaffa-pages -name '*.swf' -print -quit | grep -q .; then
            echo 'Reference SWF leaked into the Pages payload.' >&2
            exit 1
          fi

      - name: Smoke Mujaffa in Chromium
        working-directory: sindri2
        run: |
          mkdir -p target/render-artifacts
          SINDRI_EXPECT_ASSETS=1 \
          SINDRI_EXPECT_ASSET_KINDS=scene,script,texture \
          SINDRI_BASE_PATH=/mujaffa-remaster/ \
            node scripts/browser/smoke.mjs target/mujaffa-pages \
            target/render-artifacts/mujaffa.png

      - name: Upload browser capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mujaffa-browser-capture
          path: sindri2/target/render-artifacts/mujaffa.png
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: sindri2/target/mujaffa-pages

  deploy:
    name: Deploy Mujaffa
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
